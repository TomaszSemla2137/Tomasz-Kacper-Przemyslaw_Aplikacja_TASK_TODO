<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Prototype (MariaDB + PHP)</title>
</head>
<body>

<div class="container">
    <h2>Lista Zadań</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Wpisz nowe zadanie...">
        <button onclick="addTask()">Dodaj</button>
    </div>
    <ul id="taskList"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
